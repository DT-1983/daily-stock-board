name: 模擬倉每日淨值更新（不含 LLM）

on:
  schedule:
    # UTC 01:00 = 台灣 09:00，週一~週六（比 tw-board 的週二~週六多涵蓋週一）
    # 2026-08-03 修：nav 原本綁在 tw-board.yml（cron 2-6），週一完全沒有排程
    # 去重抓現價，導致模擬倉的 cur 停在上週日 rebalance 當下的數字，顯示 0%/$0。
    # 這裡獨立出來，純 yfinance 抓價 + 算報酬，不呼叫任何 LLM，週一也要跑。
    - cron: '0 1 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nav:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 裝套件
        run: pip install -r requirements.txt
      # 2026-08-19：原本四行各自 `|| echo`，前三行（算數字）失敗也會走到第四行
      # 把頁面重畫一次，而頁面當時寫的是「畫圖時間」→ 今天的日期配昨天的數字，
      # 完全看不出來（8/17 數字凍結 7 天就是這樣被蓋過去的）。
      # 現在：失敗累積成 FAILED，頁面照樣產生（portfolio_html 會自己標「資料停在 X 日」），
      # 但步驟會紅燈 + 推 Telegram，不再無聲降級。
      - name: 趨勢倉/合流倉調倉 + 記淨值 + 出賽馬頁
        id: rebal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FAILED=""
          python paper_portfolio.py rebalance-trend || FAILED="$FAILED 趨勢倉調倉"
          python paper_portfolio.py rebalance-combo || FAILED="$FAILED 合流倉調倉"
          python paper_portfolio.py nav            || FAILED="$FAILED 淨值更新"
          # 頁面還是要產生：它會自己偵測資料日期並在頁面上標示過期，
          # 不產生的話反而變成「頁面停在更舊的版本」，更難判斷。
          python portfolio_html.py -o docs/portfolios.html || FAILED="$FAILED 賽馬頁"
          if [ -n "$FAILED" ]; then
            echo "::error::模擬倉更新失敗：$FAILED"
            curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" -d parse_mode=HTML \
              -d text="🔴 <b>模擬倉更新失敗</b>%0A失敗步驟：${FAILED}%0A賽馬頁上的數字停在上次成功更新，頁面已標示資料日期。" >/dev/null || true
            exit 1
          fi
      # if: always() —— 上一步失敗時「帶過期警示的頁面」更要發佈出去，
      # 不發的話線上停在更舊的版本，使用者反而看不到警示。
      - name: 回存狀態 + 發佈
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolios.json docs/portfolios.html
          git commit -m "chore: 模擬倉每日淨值更新 [skip ci]" || echo "無變化（沒有檔案異動）"
          # push 失敗＝整趟白跑且不會自我修復，必須讓人知道，不能只 echo 一句。
          # 2026-09-01 修：8/27 給 tw-board/market-home/weekly-screen 加的 rebase 重試
          # 唯獨漏掉這支 → 本機同時段 push 一次撞車就整批丟掉（9/1 09:00 就是這樣掛的）。
          ok=""
          for i in 1 2 3; do
            if git push; then ok=1; break; fi
            echo "push 被拒（第 $i 次），rebase 遠端後重試"
            git pull --rebase || break
          done
          if [ -z "$ok" ]; then
            echo "::error::push 失敗 3 次，這次的更新沒有上線"
            curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" -d parse_mode=HTML \
              -d text="🔴 <b>模擬倉 push 失敗</b>%0A數字算好了但沒推上線，網站看到的還是舊的。" >/dev/null || true
            exit 1
          fi
