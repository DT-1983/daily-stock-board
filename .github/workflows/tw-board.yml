name: 美股晨會看板（HTML + 反轉警示 Telegram）

on:
  schedule:
    # UTC 01:00 = 台灣 09:00。本機排程 08:30 先跑判讀層並 push，這裡 09:00 才讀報告出 HTML。
    # 2026-07-31：LLM 判讀搬本機（Max plan），本 workflow 已不呼叫任何 LLM。
    - cron: '0 1 * * 2-6'
  workflow_dispatch:          # 可手動觸發

permissions:
  contents: write             # 允許把訊號狀態 commit 回 repo（反轉偵測）

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 裝套件
        run: |
          pip install -r requirements.txt
          pip install opencc-python-reimplemented markdown

      # ── 判讀層已搬本機（2026-07-31）──────────────────────────────
      # 原本這裡跑 `main.py`（美股 49 檔）+ `tw_analyze.py`（台股 37 檔），
      # 用 Gemini 3 Flash，每個運行日約 NT$24 → 約 NT$500/月。
      # 現改由本機排程 BoardAnalyzeDaily（08:30）以 Max plan headless claude 產出
      # reports/report_*.md 與 tw_analysis.json 後 push 上來，本 workflow 只負責讀。
      # 本 job 自此不再呼叫任何 LLM，也不需要 GEMINI_API_KEY / TAVILY_API_KEYS。
      - name: 確認本機判讀產出存在
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 2026-08-04 修 bug：checkout 後所有檔案 mtime 相同，`ls -t` 挑檔變成碰運氣
          # （今天實際挑到 6/24 的舊報告）。檔名帶日期，改用檔名排序才穩。
          f=$(ls reports/report_*.md 2>/dev/null | sort | tail -1)
          if [ -z "$f" ]; then echo "::error::找不到任何 reports/report_*.md"; exit 1; fi
          echo "採用報告：$f"
          # 報告超過 2 天沒更新 → 本機排程沒跑（電腦沒開機）。
          # 同理不能用 mtime 算年齡，改從檔名取日期。
          d=$(basename "$f" .md | sed 's/report_//')
          age=$(( ($(date +%s) - $(date -d "$d" +%s)) / 86400 ))
          if [ "$age" -ge 2 ]; then
            msg="⚠️ <b>看板判讀已 ${age} 天未更新</b>%0A本機排程 BoardAnalyzeDaily（08:30）可能沒執行，電腦沒開機？%0A今天的看板用的是 $(basename "$f") 的舊判讀。"
            echo "::warning::報告已 $age 天未更新，已推 Telegram"
            curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" -d parse_mode=HTML -d text="$msg" >/dev/null || true
          fi

      - name: 產 HTML 看板 + 推反轉警示 + 附完整看板
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p docs
          f=$(ls reports/report_*.md | sort | tail -1)
          echo "報告: $f"
          # 2026-08-04 首頁改版：看板搬 board.html，index.html 讓給投資資訊首頁
          python board_html.py "$f" -o docs/board.html
          python alert_telegram.py "$f" docs/board.html

      # 2026-08-18 用戶指示改每月一次：GDP 是季頻資料（主計總處/BEA 一季才發布一次），
      # 每天抓 99% 的日子拿到同一份數字，只是白跑。改成每月 1-3 號才更新
      # （抓 3 天窗口而非只認 1 號，因為本 workflow 只在週二~週六跑，
      #  1 號若落在週日/週一就整個月都不會更新）。手動觸發一律更新。
      - name: GDP 觀察頁（每月初；美台實際+預測、台灣預測過期會推 TG 提醒）
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          d=$(date -u +%d)
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$d" -gt 03 ]; then
            echo "今天 $d 號，非月初 → 跳過 GDP 更新（每月 1-3 號才跑）"
            exit 0
          fi
          python gdp_fetch.py || echo "GDP 抓取失敗，用上次的 gdp_data.json"
          python gdp_html.py -o docs/gdp.html || echo "GDP 頁失敗，跳過"

      # 2026-08-19：行情抓失敗時仍沿用舊 market_data.json 畫首頁（這是刻意的：
      # 首頁還有頭條、分頁入口，為了行情一項整頁不更新太過頭）。但降級不能無聲——
      # home_html.py 會比對資料日期，過期就在頁面頂端標紅字說明；這裡再補一則 TG。
      - name: 投資資訊首頁（行情+頭條+分頁摘要）
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if ! python market_fetch.py; then
            echo "::warning::行情抓取失敗，首頁將沿用上次的 market_data.json 並標示過期"
            curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" -d parse_mode=HTML \
              -d text="🟡 <b>大盤行情抓取失敗</b>%0A首頁沿用上次資料，頁面已標示過期日期。頭條與各分頁不受影響。" >/dev/null || true
          fi
          python home_html.py -o docs/index.html

      # 2026-08-03：趨勢倉調倉 + nav + 賽馬頁移到獨立的 portfolio-nav.yml
      # （週一~週六都跑，不綁 tw-board 的週二~週六，修掉週一淨值卡住不動的問題）
      - name: 巴菲特頁
        run: python buffett_html.py -o docs/buffett.html || echo "巴菲特頁失敗，跳過"

      - name: 回存狀態 + 發佈 HTML 到 Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/signals.json state/st_state.json state/st_flips_today.json docs/index.html docs/board.html \
                  docs/gdp.html gdp_data.json market_data.json \
                  portfolios.json docs/portfolios.html docs/buffett.html
          git commit -m "chore: update 首頁+看板+GDP+signals+巴菲特頁 [skip ci]" || echo "無變化"
          git push || echo "push 略過"
