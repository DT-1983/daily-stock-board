name: 美股晨會看板（HTML + 反轉警示 Telegram）

on:
  schedule:
    # UTC 01:00 = 台灣 09:00。本機排程 08:30 先跑判讀層並 push，這裡 09:00 才讀報告出 HTML。
    # 2026-07-31：LLM 判讀搬本機（Max plan），本 workflow 已不呼叫任何 LLM。
    - cron: '0 1 * * 2-6'
  workflow_dispatch:          # 可手動觸發

permissions:
  contents: write             # 允許把訊號狀態 commit 回 repo（反轉偵測）

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 裝套件
        run: |
          pip install -r requirements.txt
          pip install opencc-python-reimplemented markdown

      # ── 判讀層已搬本機（2026-07-31）──────────────────────────────
      # 原本這裡跑 `main.py`（美股 49 檔）+ `tw_analyze.py`（台股 37 檔），
      # 用 Gemini 3 Flash，每個運行日約 NT$24 → 約 NT$500/月。
      # 現改由本機排程 BoardAnalyzeDaily（08:30）以 Max plan headless claude 產出
      # reports/report_*.md 與 tw_analysis.json 後 push 上來，本 workflow 只負責讀。
      # 本 job 自此不再呼叫任何 LLM，也不需要 GEMINI_API_KEY / TAVILY_API_KEYS。
      - name: 確認本機判讀產出存在
        run: |
          f=$(ls -t reports/report_*.md 2>/dev/null | head -1)
          if [ -z "$f" ]; then echo "::error::找不到任何 reports/report_*.md"; exit 1; fi
          echo "採用報告：$f（$(date -r "$f" '+%Y-%m-%d %H:%M')）"
          # 報告超過 3 天沒更新 → 本機排程可能沒跑（電腦沒開機），出 HTML 但留下警告
          if [ $(( ($(date +%s) - $(date -r "$f" +%s)) / 86400 )) -ge 3 ]; then
            echo "::warning::報告已 3 天以上未更新，本機排程可能沒執行"
          fi

      - name: 產 HTML 看板 + 推反轉警示 + 附完整看板
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p docs
          f=$(ls -t reports/report_*.md | head -1)
          echo "報告: $f"
          python board_html.py "$f" -o docs/index.html
          python alert_telegram.py "$f" docs/index.html

      - name: 模擬倉每日記淨值 + 出賽馬頁 + 巴菲特頁
        run: |
          python paper_portfolio.py rebalance-trend || echo "趨勢倉每日調倉失敗，跳過"
          python paper_portfolio.py nav || echo "模擬倉更新失敗，跳過"
          python portfolio_html.py -o docs/portfolios.html || echo "賽馬頁失敗，跳過"
          python buffett_html.py -o docs/buffett.html || echo "巴菲特頁失敗，跳過"

      - name: 回存狀態 + 發佈 HTML 到 Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/signals.json state/st_state.json docs/index.html portfolios.json docs/portfolios.html docs/buffett.html
          git commit -m "chore: update board + signals + 模擬倉 + 巴菲特頁 [skip ci]" || echo "無變化"
          git push || echo "push 略過"
