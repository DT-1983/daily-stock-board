name: 每週重篩守備清單（市值+成長+籌碼）

# 2026-08-10 改版：美股/台股拆成兩個獨立 job 平行跑，互不拖累失敗
# （原本合在一支，美股 yfinance 限流會連台股一起卡住）；時間從週日 20:00
# 挪到週六早上——週五收盤後到週一開盤前資料本來就不會變，沒理由拖到週日晚上，
# 週六早上（台灣時間）美股（週五美東收盤後約 3-4 小時）、台股（週五台北收盤）
# 都已經是定案數據，提早完成對週一 09:00 的 portfolio-nav 更有緩衝。
on:
  schedule:
    - cron: '0 0 * * 6'    # UTC 週六 00:00 = 台灣週六 08:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screen-us:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 裝套件
        run: pip install yfinance requests tradingview_screener pandas numpy
      - name: 重篩美股（每鏈 top N）
        run: python screen.py --market us -o screen_us.json
      - uses: actions/upload-artifact@v4
        with:
          name: screen-us
          path: screen_us.json
          retention-days: 3

  screen-tw:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 裝套件
        run: pip install yfinance requests tradingview_screener pandas numpy
      - name: 重篩台股（每鏈 top N）
        run: python screen.py --market tw -o screen_tw.json
      - uses: actions/upload-artifact@v4
        with:
          name: screen-tw
          path: screen_tw.json
          retention-days: 3

  merge-and-downstream:
    needs: [screen-us, screen-tw]
    if: always()   # 其中一邊失敗也要跑：用舊資料補那一邊，另一邊的新資料照樣上線
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 裝套件
        # markdown/opencc-python-reimplemented: paper_portfolio.py rebalance 間接 import
        # board_html_legacy.py -> tw_report.py 需要，2026-08-17 發現這裡漏裝，
        # 導致巴菲特倉每週調倉靜默失敗（被 || echo 接住，job 顯示成功）
        run: pip install yfinance requests tradingview_screener pandas numpy litellm markdown opencc-python-reimplemented

      - uses: actions/download-artifact@v4
        with:
          name: screen-us
        continue-on-error: true   # 美股那個 job 若失敗，這裡拿不到檔案，繼續用舊資料

      - uses: actions/download-artifact@v4
        with:
          name: screen-tw
        continue-on-error: true

      - name: 合併成 screen_result.json（缺哪邊就沿用 repo 裡舊的那一半）
        run: |
          python - <<'PY'
          import json, os
          try:
              base = json.load(open("screen_result.json", encoding="utf-8"))
          except FileNotFoundError:
              base = {"us": {}, "tw": {}}
          from datetime import datetime
          out = {"date": datetime.now().strftime("%Y-%m-%d"),
                 "us": base.get("us", {}), "tw": base.get("tw", {})}
          used_new = []
          if os.path.exists("screen_us.json"):
              out["us"] = json.load(open("screen_us.json", encoding="utf-8"))["us"]
              used_new.append("美股")
          if os.path.exists("screen_tw.json"):
              out["tw"] = json.load(open("screen_tw.json", encoding="utf-8"))["tw"]
              used_new.append("台股")
          json.dump(out, open("screen_result.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          print("合併完成，這次有新資料：", "、".join(used_new) or "無（兩邊都沿用舊資料）")
          PY

      - name: 七鏈題材層（Gemini 綜整每鏈一句催化劑 → chain_themes.json）
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python chain_themes.py || echo "題材層失敗，跳過（保留舊 json）"

      - name: 全市場巴菲特掃描（美+台）→ buffett_watch.json（取代 Zeabur /bsp500，Actions IP 不限流）
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        # 2026-08-25：拿掉 --max-candidates 200（改吃預設 0 = 過篩的全部評估）。
        # 原本只算最便宜的 200 檔，美股 585 檔中有 385 檔連算都沒算。
        # 也拿掉 `|| echo`：那會讓掃描失敗變成 exit 0、workflow 綠燈、頁面照舊，
        # 完全看不出來資料沒更新（記憶庫 silent_failure_pattern）。
        # 失敗就讓這步紅燈，舊 json 本來就還在，不會有資料損失。
        run: python buffett_scan.py

      - name: 推播「本週守備清單已更新」
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, requests
          d = json.load(open("screen_result.json", encoding="utf-8"))
          us = sorted({x["code"] for l in d["us"].values() for x in l})
          tw = sorted({x["code"] for l in d["tw"].values() for x in l})
          lines = [f"📋 <b>本週守備清單已重篩</b>（每週六）",
                   f"美股 {len(us)} 檔、台股 {len(tw)} 檔",
                   f"<i>依 市值＋成長＋籌碼 三因子，每鏈取最強。週二起的盤後警示將用新清單。</i>"]
          requests.post(f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
                        json={"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": "\n".join(lines),
                              "parse_mode": "HTML"}, timeout=30)
          print("notified", len(us), len(tw))
          PY

      - name: 買進機會週報（巴菲特到價 + 雙確認）
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WH_DAILY: ${{ secrets.DISCORD_WH_DAILY }}   # 2026-08-28 Discord雙發（隆中對）
        run: python buy_digest.py || echo "買進機會週報失敗，跳過"

      - name: 產巴菲特價值清單頁（docs/buffett.html）
        run: python buffett_html.py -o docs/buffett.html || echo "巴菲特頁失敗，跳過"

      - name: 產業輪動雷達 RRG（docs/rotation.html，台股需逐檔抓歷史價較慢）
        # 這裡用 || echo 跟上面巴菲特掃描拿掉 || echo 不是同一個判斷標準反悔——
        # 差別在這步失敗會不會擋到後面步驟。巴菲特掃描是核心產出，它失敗代表
        # 這週的清單根本沒更新，讓步驟紅燈是對的。這步是新增的附加功能，
        # 排在 commit 步驟之前，若讓它紅燈會連帶擋掉後面「巴菲特頁/模擬倉/commit」
        # 全部不執行——那反而是更大的傷害。失敗時舊頁與舊歷史檔案還在，不會掉資料。
        run: python industry_rotation.py -o docs/rotation.html || echo "產業輪動頁失敗，跳過（保留舊頁與歷史）"

      - name: 模擬倉每週調倉（跟新清單）+ 出賽馬頁
        run: |
          python paper_portfolio.py rebalance || echo "調倉失敗，跳過"
          python portfolio_html.py -o docs/portfolios.html || echo "賽馬頁失敗，跳過"

      - name: commit 新清單 + 巴菲特頁 + 模擬倉
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screen_result.json chain_themes.json buffett_watch.json docs/buffett.html portfolios.json docs/portfolios.html docs/rotation.html industry_rotation_history.json
          git commit -m "chore: weekly re-screen(美台分開) + 巴菲特掃描 + 頁 + 模擬倉 [skip ci]" || echo "無變化"
          git push || echo "push 略過"
